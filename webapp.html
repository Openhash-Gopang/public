<!-- ── 신청서 docx 자동생성 (2026-07-30 신설) ──────────────────────
     REQUIRED_DOCUMENTS_REGISTRY의 schema(documents + applicant_fields)와
     실제 수집된 값을 코드가 직접 템플릿에 채운다 — LLM에게 "신청서를
     써달라"고 요청하지 않는다. SP 문구 품질과 무관하게 항상 동일한
     구조의 문서가 나오게 하기 위함(2026-07-30 검토 결과에 따른 설계
     원칙 — worker.js REQUIRED_DOCUMENTS_REGISTRY 주석 참조). -->
<script type="module">
import { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell,
  WidthType, AlignmentType, HeadingLevel, ShadingType }
  from 'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.mjs';

function _cell(text, opts = {}) {
  return new TableCell({
    width: opts.width ? { size: opts.width, type: WidthType.DXA } : undefined,
    shading: opts.header ? { type: ShadingType.CLEAR, fill: 'E8EEF7' } : undefined,
    children: [new Paragraph({
      alignment: opts.center ? AlignmentType.CENTER : AlignmentType.LEFT,
      children: [new TextRun({ text: text || '', bold: !!opts.header, size: 20 })],
    })],
  });
}
function _fieldRow(label, value) {
  return new TableRow({ children: [_cell(label, { header:true, width:2600 }), _cell(value, { width:6800 })] });
}
const _ACQ_LABEL = { gov24: '정부24 발급', user_authored: '본 신청서와 함께 작성', external_insurer: '제3자(보험사 등) 발급' };

// schema: worker.js REQUIRED_DOCUMENTS_REGISTRY 항목 그대로(/gov/task/schema/lookup 응답).
// caseState: <<<STATE>>>로 이미 수집된 6필드. fields: applicant_fields 수집값(id→value).
window._buildApplicationDocx = async function(schema, caseState, fields) {
  const applicantRows = (schema.applicant_fields || []).map(f => _fieldRow(f.label, fields[f.id]));
  const doc = new Document({
    sections: [{
      properties: { page: { size: { width: 11907, height: 16840 } } }, // A4
      children: [
        new Paragraph({ alignment: AlignmentType.CENTER, heading: HeadingLevel.HEADING_1,
          children: [new TextRun({ text: schema.task_name + ' 신청서', bold:true, size:32 })] }),
        new Paragraph({ alignment: AlignmentType.CENTER, spacing:{ after:300 },
          children: [new TextRun({ text: `근거 법령: ${schema.legal_basis || '해당 기관 안내 참조'}`, size:18, color:'666666' })] }),

        new Paragraph({ heading: HeadingLevel.HEADING_2, spacing:{ before:200, after:120 },
          children: [new TextRun({ text: '1. 신청인 정보', bold:true, size:24 })] }),
        new Table({ width:{ size:9400, type:WidthType.DXA }, columnWidths:[2600,6800], rows: applicantRows }),

        new Paragraph({ heading: HeadingLevel.HEADING_2, spacing:{ before:300, after:120 },
          children: [new TextRun({ text: '2. 민원 개요', bold:true, size:24 })] }),
        new Table({ width:{ size:9400, type:WidthType.DXA }, columnWidths:[2600,6800], rows: [
          _fieldRow('민원 목적', caseState.purpose),
          _fieldRow('관할 지역', caseState.region),
          _fieldRow('기한/긴급도', caseState.urgency),
          _fieldRow('그 외 사실', caseState.extra),
        ]}),

        new Paragraph({ heading: HeadingLevel.HEADING_2, spacing:{ before:300, after:120 },
          children: [new TextRun({ text: '3. 첨부 서류 (레지스트리 자동 대조)', bold:true, size:24 })] }),
        new Table({ width:{ size:9400, type:WidthType.DXA }, columnWidths:[5000,3000,1400], rows: [
          new TableRow({ children: ['서류명','구분','필수여부'].map((h,i) =>
            _cell(h, { header:true, center:true, width:[5000,3000,1400][i] })) }),
          ...schema.documents.map(d => new TableRow({ children: [
            _cell(d.name, { width:5000 }),
            _cell(_ACQ_LABEL[d.acquisition] || d.acquisition, { center:true, width:3000 }),
            _cell(d.required ? '필수' : '선택', { center:true, width:1400 }),
          ]})),
        ]}),

        new Paragraph({ spacing:{ before:400 }, children: [
          new TextRun({ text: '※ "정부24 발급" 서류는 정부24 앱/웹에서 미리 발급받아 함께 제출하십시오. ', size:18 }),
          new TextRun({ text: '"본 신청서와 함께 작성" 서류는 이 신청서와 함께 별도로 준비하십시오.', size:18 }),
        ]}),
        !schema.__verified ? new Paragraph({ spacing:{ before:200 }, children: [
          new TextRun({ text: '⚠ 이 서류 목록은 아직 사람 검토 전 임시 조사 결과입니다. 정확한 요건은 관할 기관 공식 안내로 다시 확인하십시오.', size:18, color:'B02A2A', bold:true }),
        ]}) : new Paragraph({ text: '' }),

        new Paragraph({ spacing:{ before:500 }, alignment: AlignmentType.RIGHT,
          children: [new TextRun({ text: `신청일: ${new Date().toLocaleDateString('ko-KR')}`, size:20 })] }),
        new Paragraph({ spacing:{ before:500 }, alignment: AlignmentType.CENTER,
          children: [new TextRun({ text: `${schema.agency_name} 귀중`, bold:true, size:24 })] }),
      ],
    }],
  });
  return await Packer.toBlob(doc);
};
</script>

<script>
// ══════════════════════════════════════════════════════════════
// GWP 파라미터 파싱 (gopang → 새 탭 호출 시 전달)
// ══════════════════════════════════════════════════════════════
const _qs        = new URLSearchParams(location.search);
const GWP_MODE    = _qs.get('gwp') === '1';
const GWP_TOKEN   = _qs.get('token')  || '';
const GWP_ORIGIN  = _qs.get('origin') || '';
let   GWP_CTX     = '';
if (_qs.get('ctx')) {
  try {
    GWP_CTX = (_qs.get('ctx_enc') === 'b64')
      ? decodeURIComponent(escape(atob(_qs.get('ctx'))))
      : decodeURIComponent(_qs.get('ctx'));
  } catch(e) { GWP_CTX = ''; }
}
// 진단 로그 (2026-07-30 신설) — "컨텍스트가 안 넘어온다" 재현 시 gopang
// 쪽(ctx 파라미터 생성) 문제인지 이쪽(파싱/소비) 문제인지 즉시 구분하기
// 위한 임시 로그. GWP_MODE(gwp=1)일 때만 찍는다 — 직접 접속 시엔 원래
// ctx가 없는 게 정상이라 노이즈만 됨.
if (GWP_MODE) {
  console.info('[K-Public] GWP_CTX 수신:',
    GWP_CTX ? `O (${GWP_CTX.length}자)` : 'X (비어있음 — URL에 ctx 파라미터 자체가 없거나 빈 값)');
}
// ── facts(2026-07-30 신설) — 메인 비서가 이미 확보한 위치 정보 ──────
// engine.js의 _gwpLaunch()는 _buildRoutingFacts()로 currentLocation을
// facts/facts_enc 파라미터에 실어 보내는데, 지금까지 K-Public이 이걸
// 전혀 읽지 않고 있었다(실사용 중 발견 — 사용자가 매번 위치를 다시
// 질문받는 원인). "SP 문구로 묻지 말라고 지시" 방식은 이행을 강제할
// 수 없으므로(LLM이 안 따를 수 있음), 아예 코드가 이 값을 대화 시작
// 전에 caseState.region에 직접 채워 넣는다 — 물어볼 필요 자체를
// 없앤다. 사용자가 나중에 다른 지역이라고 정정하면(STATE 파싱의
// 기존 병합 규칙상) 그 값이 그대로 덮어쓴다.
let GWP_FACTS = null;
if (_qs.get('facts')) {
  try {
    const raw = (_qs.get('facts_enc') === 'b64')
      ? decodeURIComponent(escape(atob(_qs.get('facts'))))
      : decodeURIComponent(_qs.get('facts'));
    GWP_FACTS = JSON.parse(raw);
  } catch (e) { console.warn('[K-Public] facts 파싱 실패(무시):', e.message); GWP_FACTS = null; }
}
if (GWP_MODE) {
  console.info('[K-Public] GWP_FACTS 수신:', GWP_FACTS ? JSON.stringify(GWP_FACTS) : 'X (없음)');
}
// ★ 2026-07-30 복구 — 위치정보 패치 작업 중 실수로 이 선언을 통째로
// 지웠던 버그. node --check(문법 검사)로는 못 잡히는 런타임 오류였다
// (읽기 시점엔 선언이 없어 ReferenceError) — 실사용 중 발견·확인.
let _gwpSeedUsed = false;

const _sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2));
const _sessionStartedAt = new Date().toISOString();

// ── 대화 종료 시 이중 보고: (a) 자기 PDV에 원문 시간순 저장, (b) 나만의
// AI 비서에게 6하원칙 보고(GWP_DONE). GWP 경유(gwp=1)일 때만 수행 —
// 직접 접속 시엔 opener가 없으므로 보고 대상 자체가 없다.
// 2026-07-26: 로컬 41줄 구현을 공유모듈(gwp-report-client.js)로 이관.
// 함수 시그니쳐(resultText, summaryLine)는 그대로 유지해 호출부는
// 손대지 않는다. gopang 저장소 GWP_DONE 컴플라이언스 전수 조사 결과
// "레거시 통과"였던 9개 서비스 중 하나(참고 구현: klaw webapp.html).
async function _reportSessionEnd(resultText, summaryLine) {
  if (!GWP_MODE) return; // 직접 접속(비-GWP)이면 모듈 fetch 자체를 생략 — 기존 동작 그대로
  const { reportGwpSessionEnd } = await import('https://hondi.net/src/gopang/gwp/gwp-report-client.js');
  return reportGwpSessionEnd({
    agencyId: AGENCY_ID,
    guid: _govGuid(),
    messages: conversationState.messages,
    resultText,
    summaryLine,
    gwpMode: GWP_MODE,
    gwpOrigin: GWP_ORIGIN,
    sessionId: _sessionId,
    sessionStartedAt: _sessionStartedAt,
  }).catch(() => {});
}

// ══════════════════════════════════════════════════════════════
// 서버 강제 상속 릴레이(/gov/relay) — K-Public 공통 규칙은 서버가

// ══════════════════════════════════════════════════════════════
const PROXY          = 'https://hondi-proxy.tensor-city.workers.dev';
const GOV_RELAY_URL   = PROXY + '/gov/relay';
const AGENCY_ID       = 'public';
const GOV_TIER        = 'gov-flash'; // 민원 안내는 무거운 추론이 필요 없음

function escHtml(str) { return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── K-Public 고유 규칙 (K-Public 공통 규칙은 서버가 앞에 자동으로 붙임) ──
// SP-COMMON-04(M1~M12) 원칙 준수: AI 주도·1턴 1질문·사용자 질문 우선 응답·
// 종료 기준선·감정 공감·음성입력 처리·상태 마커 길이 상한.
//
// 2026-07-05 taxonomy 정비: 정체성(한국 고유, 제주 예시 포함)과 방법론
// (국가 무관, 재사용 가능)을 분리했다. 최종 AGENCY_PROMPT 텍스트는 기존과
// 100% 동일 — 동작 변화 없는 순수 구조 리팩터링. 제주 기관 예시는 표본
// 지역 예시일 뿐 gov-kr 정체성 블록에 포함(다른 지역 확장 시 이 블록만
// 교체하면 됨).

// gov-kr: 한국 고유 정체성 — 지방행정 민원 창구, 전국 16개 광역시도 대응
// 2026-07-26 정정: provinceCode(guessProvinceCode, gov-router.js)가 이미
// 전국 라우팅을 처리하는데 프롬프트 문구가 "표본 지역은 제주"라고 돼 있어
// 제주만 지원하는 것처럼 오해될 여지가 있었다. 로직 변경 없이 문구만
// 정정한다(순수 텍스트 수정).
const GOV_KR_IDENTITY = `당신은 지방행정 민원 창구를 대신하는 K-Public 안내 AI입니다.
사용자와의 대화를 "당신이" 주도하여, 민원을 정확히 파악하고 담당 기관
(도청/시청/읍면동사무소 중 어디인지)과 처리 절차를 안내합니다.
실제 주민센터 창구 직원처럼 친절하고 사무적이지 않게 대화하세요.

전국 16개 광역시도와 관할 시군구/읍면동을 시스템이 자동으로 판별해 안내에
활용합니다. 아래는 제주특별자치도의 실제 기관 정보 예시입니다 — 사용자가
제주 지역 민원이면 그대로 활용하고, 다른 지역이면 해당 지역의 동급 기관으로
안내하되, 정확한 연락처는 모르면 "관할 기관에 확인하십시오"라고 명시하세요:
- 제주특별자치도청(광역 단위 민원): 제주시 문연로 6(연동), 대표전화 064-120
- 제주시청(기초자치단체 단위 민원): 제주시 광양9길 10(이도이동), 064-728-2114
- 한림읍사무소(읍면동 단위 민원, 제주시 한림읍 관할): 제주시 한림읍 한림상로
  132, 064-728-1521`;

// k-gov: 글로벌 표준 — 민원 인터뷰 진행 방법론(국가 무관 재사용 가능)
const K_GOV_METHODOLOGY = `절대 규칙:
1. 한 턴에 정확히 하나의 질문만 한다. 여러 질문을 한 번에 나열하지 않는다.
2. 사용자가 이미 말한 내용을 다시 묻지 않는다. 음성 입력 특성상 문장부호
   없이 여러 사실을 한꺼번에 말할 수 있다 — 이미 답변된 항목을 놓치지 말고,
   애매하면 넘겨짚지 말고 짧게 되물어 확인한다.
3. 사용자가 (질문이 아니라) 잡담·불만·답답함을 표현하면 한두 문장으로 짧게
   공감하고 다음 질문으로 돌아온다.
4. 사용자가 당신에게 진짜 질문("이거 왜 필요해요?", "얼마나 걸려요?" 등)을
   던지면 절대 무시하지 않는다. 먼저 그 질문에 짧고 솔직하게 답한 다음,
   원래 흐름으로 자연스럽게 되돌아온다.
5. 파악해야 할 항목: 민원 유형(전입신고/인허가/증명서 발급/세금 문의/기타
   등 구체적으로), 신청인 구분(개인/법인), 목적, 관할 지역(주소/거주지),
   기한이 급한지 여부. 민원 성격상 추가로 필요한 정보(예: 사업자등록 여부,
   대상 부동산 소재지 등)도 함께 확인한다.
6. 완벽주의에 빠지지 않는다 — 보통 3~5회 질문이면 충분한 정보가 모인다.
   충분히 파악됐다고 판단되면 더 묻지 않고 안내를 시작한다.

사용자에게 보여줄 답변 본문을 먼저 쓰고, 맨 마지막 줄에 반드시 아래 형식의
상태 마커를 한 줄로 덧붙인다(시스템이 파싱만 하고 사용자에게는 보이지
않으므로, 자연스러운 대화 톤 유지에만 신경 쓰면 된다). 각 필드는 반드시
100자 이내로 짧게 요약해 누적하라:

<<<STATE>>>{"type":"","applicant":"","purpose":"","region":"","urgency":"","extra":"","ready":false}<<<END>>>

- type: 민원 유형(구체적으로). 모르면 빈 문자열.
- applicant: 개인/법인 등 신청인 구분
- purpose: 민원 목적
- region: 관할 지역(주소·거주지)
- urgency: 기한 촉박 여부 및 사유
- extra: 그 외 민원 유형별로 중요한 추가 사실을 100자 이내로 누적
- ready: 안내를 시작해도 좋다고 판단되면 true, 아직 더 물어봐야 하면 false`;

const AGENCY_PROMPT = `${GOV_KR_IDENTITY}\n\n${K_GOV_METHODOLOGY}`;

function _parseInterviewState(raw) {
  const m = raw.match(/<<<STATE>>>([\s\S]*?)<<<END>>>/);
  let state = null;
  if (m) { try { state = JSON.parse(m[1]); } catch(e) { state = null; } }
  let visible = raw.replace(/<<<STATE>>>[\s\S]*?<<<END>>>/, '').trim();
  // 방어: 토큰 한도로 <<<END>>> 없이 마커가 잘린 경우, 마커 시작점부터 전부 잘라낸다.
  const cutIdx = visible.indexOf('<<<STATE>>>');
  if (cutIdx !== -1) visible = visible.slice(0, cutIdx).trim();
  return { visible, state };
}

// ══════════════════════════════════════════════════════════════
// 공용 릴레이 호출 — BYOK 없음, K-Public 공통 규칙은 서버가 자동 삽입
// ══════════════════════════════════════════════════════════════
async function _pumpSSE(response, handleJson) {
  if (!response.ok) {
    let errMsg = `HTTP ${response.status}`;
    try { const errBody = await response.json(); errMsg = errBody.message || errBody.error?.message || errBody.error || errMsg; } catch(e) {}
    throw new Error(errMsg);
  }
  const reader = response.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buf = '';
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      const t = line.trim();
      if (!t.startsWith('data:')) continue;
      const payload = t.slice(5).trim();
      if (payload === '[DONE]') continue;
      let json;
      try { json = JSON.parse(payload); } catch(e) { continue; }
      handleJson(json);
    }
  }
}

function _govGuid() { return kpubUser?.ipv6 || GWP_TOKEN || 'anonymous'; }

const K_PUBLIC_COMMON_RAW_URL = 'https://raw.githubusercontent.com/Openhash-Gopang/gopang/main/prompts/K-Public_common_v1_2.md'; // 2026-07-04 수정: 존재하지 않거나(또는 구버전) 참조하던 'K-Public_common_v1_0.md' 버그
let _kPublicCommonClientCache = null;
async function _fetchKPublicCommonClient() {
  if (_kPublicCommonClientCache) return _kPublicCommonClientCache;
  try {
    const r = await fetch(K_PUBLIC_COMMON_RAW_URL, { cache: 'no-cache' });
    if (r.ok) {

      // BYOK 경로는 이 원문을 그대로 쓰므로 여기서도 동일하게 치환해야 한다 —

// §① 감사에서 발견 — 지금까지는 K-Public_common만 붙고 이 레이어는

const UNIVERSAL_INTEGRITY_RAW_URL = 'https://raw.githubusercontent.com/Openhash-Gopang/gopang/main/prompts/UNIVERSAL-INTEGRITY_v1_0.md';
const UNIVERSAL_COMMON_RAW_URL    = 'https://raw.githubusercontent.com/Openhash-Gopang/gopang/main/prompts/UNIVERSAL-common_v1_1.md';
let _universalLayerClientCache = null;

// ── GPS/PDV 위치감지 (2026-07-21 신설) ──────────────────────────
// jeju/webapp.html의 패턴을 재사용하되, "제주 밖이면 버림" 필터는
// 뺀다 — K-Public은 전국 서비스라 어느 지역 좌표든 유효한 힌트다.
let _gpsLocationCache = null;
let _gpsAttempted = false;
async function _detectGpsLocationText() {
  if (_gpsAttempted) return _gpsLocationCache;
  _gpsAttempted = true;
  if (!navigator.geolocation) return null;
  try {
    const pos = await new Promise((resolve, reject) => {
      navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 6000, maximumAge: 300000 });
    });
    const { latitude: lat, longitude: lng } = pos.coords;
    const r = await fetch(`${PROXY}/geocode?lat=${lat}&lng=${lng}`);
    if (!r.ok) throw new Error('geocode ' + r.status);
    const d = await r.json();
    const doc = d.documents?.[0];
    if (!doc) return null;
    const region1 = doc.road_address?.region_1depth_name || doc.address?.region_1depth_name;
    const region2 = doc.road_address?.region_2depth_name || doc.address?.region_2depth_name;
    if (!region1) return null;
    _gpsLocationCache = `${region1} ${region2 || ''}`.trim();
    return _gpsLocationCache;
  } catch (e) {
    console.warn('[K-Public] GPS 위치 확인 실패(권한 거부·타임아웃 등):', e.message);
    return null;
  }
}

// PDV 거주지 힌트(GPS 실패 시 폴백) — jeju/webapp.html과 동일 로직.
function _pdvLocationHint() {
  try {
    const p = JSON.parse(localStorage.getItem('gopang_user_v4') || sessionStorage.getItem('gopang_user_v4') || 'null');
    return p?.address || p?.location || null;

// 사용자 발화·GPS·PDV로 도코드를 판별한다(SP 조립 없이 가벼움). 실패해도
// 예외를 던지지 않고 null로 안전하게 대체 — 이 기능이 죽어도 기존 K-Public
// 상담 흐름에 영향 없음.
async function _resolveProvinceCodeForDelegation(messages) {
  try {
    if (!window._guessProvinceCode) return null;
    const lastUserMsg = [...messages].reverse().find(m => m.role === 'user');
    const locationHint = (await _detectGpsLocationText()) || _pdvLocationHint();
    return await window._guessProvinceCode(lastUserMsg?.content || '', locationHint);
  } catch (e) {
    console.warn('[K-Public] provinceCode 판별 실패(무시):', e.message);
    return null;
  }
}

async function _govCallRaw(messages, opts = {}) {
  const { maxTokens = 1000, stream = false, onChunk = null } = opts;

  const byok = _activeByok();
  if (byok) {
    const [universalLayer, kPublicCommon] = await Promise.all([
      _fetchUniversalLayerClient(), _fetchKPublicCommonClient(),
    ]);
    const systemLayers  = [universalLayer, kPublicCommon, AGENCY_PROMPT].filter(Boolean);
    const systemContent = systemLayers.join('\n\n---\n\n');
    try {
      return await _llmRelayCall(byok, [{ role:'system', content: systemContent }, ...messages], { maxTokens, stream, onChunk });
    } catch(e) {
      throw new Error(`${byok.name} 호출 실패: ${e.message} — 설정에서 API Key를 확인해 주세요.`);
    }
  }

  // provinceCode(2026-07-21 신설) — K-Public 상담 중 LLM이 gov_do/
  // gov_national로 위임(sp_call)할 경우에 대비해 항상 실어 보낸다.
  // 위임이 안 일어나는 일반 K-Public 응답에는 서버가 이 필드를
  // 무시하므로 부작용이 없다.
  const provinceCode = await _resolveProvinceCodeForDelegation(messages);

  const resp = await fetch(GOV_RELAY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      guid: _govGuid(), agency: AGENCY_ID, agencyPrompt: AGENCY_PROMPT,
      messages, max_tokens: maxTokens, stream, tier: GOV_TIER, provinceCode,
      // ★ 2026-07-30 — 서버(handleGovRelay)가 342개 기관 전부에 공통으로
      // 강제 주입하도록 원본 위치값을 함께 보낸다. K-Public 고유 규칙
      // 문구에만 의존하지 않는다 — SP를 공유하는 모든 기관에 적용된다.
      currentLocation: GWP_FACTS?.currentLocation || null,
    })
  });

  if (stream) {
    let fullText = '';
    await _pumpSSE(resp, (json) => {
      const delta = json.choices?.[0]?.delta?.content || '';
      if (delta) { fullText += delta; onChunk && onChunk(delta, fullText); }
    });
    return fullText;
  }

  let data;
  try { data = await resp.json(); } catch(e) { throw new Error(`HTTP ${resp.status}`); }
  if (!resp.ok || data.error) throw new Error(data.message || data.error || `HTTP ${resp.status}`);
  return data.choices?.[0]?.message?.content || '';
}

// 2026-07-04: PDV_HISTORY_REQUEST(P11) 가로채기 계층. _govCallRaw의 응답에
// [PDV_HISTORY_REQUEST:...] 태그가 있으면, pdv-history-client.js로 실제
// /pdv/query를 호출하고 그 결과를 컨텍스트에 주입해 한 번 더 호출한다.
// 동의가 필요해 리다이렉트가 시작된 경우(redirecting:true)엔 원 텍스트를
// 그대로 반환한다 — 어차피 곧 페이지 이동이 일어나 이후 반환값은 쓰이지 않는다.
async function _govCall(messages, opts = {}) {
  const raw = await _govCallRaw(messages, opts);
  if (!window.PdvHistoryClient || !/\[PDV(?:_HISTORY)?_REQUEST:/.test(raw)) return raw;

  const { interceptPdvTags } = window.PdvHistoryClient;
  const r = await interceptPdvTags(raw, {
    svc: AGENCY_ID, ipv6: _govGuid(),
    resumeContext: { messages, opts },
  });
  if (!r) return raw;
  if (r.redirecting) return raw; // 페이지 이동 중 — 반환값은 사실상 안 쓰임

  const summaryText = (r.results || []).map(x => {
    if (x.error) return `(${x.scope} 이력 조회 실패: ${x.error})`;
    if (!x.summary || x.summary.available === false) return `(${x.scope} 이전 기록 없음)`;
    return `(${x.scope} 이전 기록: ${JSON.stringify(x.summary)})`;
  }).join('\n');

  // 태그를 제거한 원문 + 조회 결과를 함께 다시 넣어 최종 답변을 한 번 더 받는다.
  const cleaned = raw.replace(/\[PDV(?:_HISTORY)?_REQUEST:[^\]]+\]/g, '').trim();
  const followUp = [
    ...messages,
    { role: 'assistant', content: cleaned || '(이전 기록을 조회하겠습니다)' },
    { role: 'user', content: `[시스템: PDV 조회 결과]\n${summaryText}\n\n위 조회 결과를 반영해서 답변을 이어가 주세요.` },
  ];
  return _govCallRaw(followUp, opts);
}

// 2026-07-04: consent.html에서 돌아온 직후인지 확인 — PDV_HISTORY_REQUEST(P11) 파일럿.
document.addEventListener('DOMContentLoaded', async () => {
  if (!window.PdvHistoryClient) return;
  const back = window.PdvHistoryClient.checkPdvConsentReturn();
  if (!back) return;
  if (back.denied) {
    appendBubble('ai', '이전 기록 조회에 동의하지 않으셨네요. 처음부터 다시 도와드릴게요.');
    return;
  }
  if (back.granted) {
    appendBubble('ai', '동의 확인했습니다. 이전 기록을 반영해서 이어가겠습니다...');
    if (back.resumeContext?.messages) {
      try {
        const resumed = await _govCall(back.resumeContext.messages, back.resumeContext.opts || {});
        appendBubble('ai', resumed);
      } catch (e) {
        appendBubble('ai', `이어서 진행하는 중 오류가 발생했습니다: ${e.message}`);
      }
    }
  }
});

// 백엔드(/gov/relay)는 아직 파일 업로드를 받지 않으므로, 텍스트류
// 파일은 읽어서 다음 사용자 메시지 앞에 자동으로 붙여 보내고, 이미지 등
// 그 외 파일은 칩으로 표시만 해 사용자가 상담 중 "이 서류를 첨부했다"는

let attachedFiles = [];
let attachedTextContext = '';

// ★ 2026-07-28 — 아래 handleAttach/toggleMic/_micAutoResize/_updateSendBtn은
// 표준 chat-input.js 모듈로 대체되면서 더 이상 어디서도 호출되지 않는다
// (참조하던 #chat-input/#send-btn/#mic-btn/#file-input 엘리먼트 자체가
// 마크업에서 제거됨). 안전하게 죽은 코드로 남겨뒀다 — 혹시 놓친 의존성이
// 있을까 봐 삭제 대신 무해화만 했다. 문제없음이 확인되면 정리 대상.
function handleAttach(inputEl) {
  const files = Array.from(inputEl.files || []);
  files.forEach(f => {
    attachedFiles.push(f);
    const chip = document.createElement('span');
    chip.className = 'file-chip';
    chip.innerHTML = `📎 ${escHtml(f.name)} <button type="button">✕</button>`;
    chip.querySelector('button').onclick = () => {
      attachedFiles = attachedFiles.filter(x => x !== f);
      chip.remove();
    };
    document.getElementById('file-chips').appendChild(chip);

    if (/\.(txt|md)$/i.test(f.name)) {
      const reader = new FileReader();
      reader.onload = () => { attachedTextContext += `\n\n[첨부파일 "${f.name}" 내용]\n${reader.result}`; };
      reader.readAsText(f);
    }
  });
  inputEl.value = '';
}

async function _resolveNickname(ipv6) {
  if (!ipv6) return '회원';
  try {
    const L1_URL = 'https://l1-hanlim.hondi.net/api/collections/profiles/records';
    const filter = encodeURIComponent(`guid='${ipv6}'`);
    const r = await fetch(`${L1_URL}?filter=${filter}&perPage=1`);
    const d = await r.json();
    return d.items?.[0]?.nickname || '회원';
  } catch(e) { console.warn('[K-Public] 닉네임 조회 실패:', e.message); return '회원'; }
}

function startGreeting() {
  if (conversationState.phase !== 'boot') return;
  const name = kpubNickname || '회원';
  if (GWP_MODE) {
    console.info('[K-Public] startGreeting 진입 시점 GWP_CTX:',
      GWP_CTX ? `O (${GWP_CTX.length}자) — seed 분기로 가야 함` : 'X — 기본 인사말 분기로 감',
      '| _gwpSeedUsed:', _gwpSeedUsed);
  }

  // BUG-FIX(2026-07-03, 2차): 1차 수정은 GWP_CTX가 있으면 정적 인사+재질문을
  // 건너뛰긴 했지만 (a) "확인하고 있습니다…" 말풍선이 곧바로 이어지는 타이핑
  // 스피너와 의미가 겹쳐 "확인 중"을 두 번 말하는 것처럼 보였고, (b) 그 말풍선이
  // 사용자 발화보다 먼저 나와 순서가 거꾸로였고, (c) 원래 정적 인사에 있던
  // 책임범위 고지(응급 신고 안내 등)가 이 경로에서는 통째로 빠졌었다. 이제
  // 사용자 발화를 먼저 보여준 뒤, 자기소개 대신 반드시 유지해야 하는 고지
  // 문장만 짧게 보여주고, 곧바로 인터뷰 스피너로 넘어간다.
  if (GWP_CTX && !_gwpSeedUsed) {
    _gwpSeedUsed = true;
    appendBubble('user', `<i>(AI 비서로부터 전달됨)</i><br>${escHtml(GWP_CTX).replace(/\n/g,'<br>')}`);
    // ★ 2026-07-30 버그 수정 — 이 분기만 _hasGreetedBefore() 체크 없이
    // 매번 무조건 고지문구를 출력하고 있었다(아래 직접 접속 분기는
    // 재방문 시 건너뛰는데, GWP 경유 분기만 그 체크가 빠져 있었음 —
    // "삭제해도 계속 재발생"으로 보였던 현상의 실제 원인). 최초 1회만
    // 보여주고, 재방문부터는 생략한다.
    if (!_hasGreetedBefore()) {
      appendBubble('ai', `저는 K-Public입니다. 다만 저는 실제 행정처분을 내리거나 본인 확인이 필요한 신청·신고를 대신 접수할 수 없습니다 — 정확한 접수는 안내해 드리는 공식 채널에서 진행해 주셔야 합니다.`);
      _markGreeted();
    }
    conversationState.phase = 'interviewing';
    _handleInterviewTurn(GWP_CTX);
    return;
  }

  if (!_hasGreetedBefore()) {
    appendBubble('ai', `
      안녕하세요. K-Public을 처음 이용하시는군요. 저는 지방행정 민원 안내 AI입니다.<br>
      <b>${escHtml(name)}</b>님의 민원을 파악해서 담당 기관(도청·시청·읍면동사무소 중 어디인지)과
      처리 절차를 안내해 드립니다. 다만 저는 실제 행정처분을 내리거나 본인 확인이
      필요한 신청·신고를 대신 접수할 수 없습니다 — 정확한 접수는 안내해 드리는
      공식 채널에서 진행해 주셔야 합니다.<br><br>
      어떤 민원으로 오셨는지 편하게 말씀해 주세요.
    `);
    _markGreeted();
  } else {
    appendBubble('ai', escHtml(_pickRepeatGreeting(name)));
  }

  conversationState.phase = 'interviewing';
}

setTimeout(() => { if (conversationState.phase === 'boot') { kpubNickname = '회원'; startGreeting(); } }, 4000);

// ══════════════════════════════════════════════════════════════
// 메시지 전송 · 대화 분기
// ══════════════════════════════════════════════════════════════
// ★ 2026-07-28 리팩터 — 이전엔 #chat-input DOM에서 직접 값을 읽었는데,
// 표준 chat-input.js 모듈은 onSend(text, files) 콜백 방식이라 파라미터로
// 받는 형태로 바꿨다. 겸사겸사 기존 버그도 고쳤다 — attachedTextContext
// (첨부파일에서 추출한 텍스트)가 추출만 되고 실제 발화에 한 번도 안 쓰이고
// 있었다(handleAttach가 채워두기만 하고 읽는 곳이 없었음). 이제 files의
// extractedText를 실제로 합쳐서 보낸다.
async function sendMessage(text, files = []) {
  if (!text || !text.trim()) return;
  const attachedText = (files || [])
    .filter(f => f.extractedText)
    .map(f => `\n\n[첨부파일 "${f.name}" 내용]\n${f.extractedText}`)
    .join('');
  const fullText = text + attachedText;

  appendBubble('user', escHtml(text).replace(/\n/g,'<br>'));

  switch (conversationState.phase) {
    case 'interviewing': await _handleInterviewTurn(fullText); break;
    case 'collecting_fields': await _handleFieldCollectionTurn(fullText); break;
    case 'generating':
      appendBubble('ai', '안내문을 준비하는 중입니다. 잠시만 기다려 주세요.');
      break;
    default: await _handleFreeQuestion(fullText); break;
  }
}

async function _handleInterviewTurn(text) {
  let userContent = text;
  if (GWP_CTX && !_gwpSeedUsed) {
    const locNote = GWP_FACTS?.currentLocation
      ? `\n\n[시스템 — 이미 확보된 정보] 사용자의 현재 위치/지역: ${GWP_FACTS.currentLocation} — 이미 확보되어 있으니 다시 묻지 마십시오. 사용자가 이후 다른 지역의 민원이라고 명시하면 그 발화를 따르십시오.`
      : '';
    userContent = `[사용자가 사전에 "나만의 AI 비서"와 나눈 맥락 — 참고만 하고 그대로 인용하지 말 것]\n${GWP_CTX}\n\n[사용자의 이번 발화]\n${text}${locNote}`;
    _gwpSeedUsed = true;
  }
  conversationState.messages.push({ role:'user', content: userContent });
  conversationState.turnCount++;

  const typing = appendTyping();
  try {
    // ★ 2026-07-30 버그 수정 — maxTokens:800은 STATE JSON 마커까지 포함한
    // 응답에 너무 빡빡해서, 답변이 많이 필요한 턴(여러 단계 확인 등)에서
    // 문장 중간에 잘리는 문제가 실사용 중 확인됐다(사용자 리포트).
    const raw = await _govCall(conversationState.messages, { maxTokens: 1500 });
    typing.remove();
    const { visible, state } = _parseInterviewState(raw);
    conversationState.messages.push({ role:'assistant', content: raw });

    if (state) {
      conversationState.caseState = {
        type:      state.type      || conversationState.caseState.type,
        applicant: state.applicant || conversationState.caseState.applicant,
        purpose:   state.purpose   || conversationState.caseState.purpose,
        region:    state.region    || conversationState.caseState.region,
        urgency:   state.urgency   || conversationState.caseState.urgency,
        extra:     state.extra     || conversationState.caseState.extra,
      };
    }

    appendBubble('ai', escHtml(visible || '죄송합니다, 방금 답변이 조금 끊겼네요. 다시 한번 말씀해 주시겠어요?').replace(/\n/g,'<br>'));

    if (state?.ready && conversationState.turnCount >= 2) {
      await _onInterviewReady();
    }
  } catch(e) {
    typing.remove();
    appendBubble('ai', `⚠ ${escHtml(e.message)}`);
  }
}

// ══════════════════════════════════════════════════════════════
// 2026-07-30 신설 — 인터뷰 종료(ready:true) 직후, 자유 텍스트 안내로
// 바로 가기 전에 REQUIRED_DOCUMENTS_REGISTRY 매칭을 먼저 시도한다.
// 매칭되면 신청서 자동생성(docx) 경로로, 안 되면(대부분 — 레지스트리가
// 아직 2건뿐) 기존 runGuidanceGen() 자유 안내로 그대로 폴백한다 —
// 동작 변경이 실패해도 기존 경험이 깨지지 않도록 항상 폴백을 둔다.
// ══════════════════════════════════════════════════════════════
function _caseSummaryText(cs) {
  return [
    cs.type && `민원유형: ${cs.type}`, cs.applicant && `신청인구분: ${cs.applicant}`,
    cs.purpose && `목적: ${cs.purpose}`, cs.region && `지역: ${cs.region}`,
    cs.extra && `추가사실: ${cs.extra}`,
  ].filter(Boolean).join(', ');
}

async function _onInterviewReady() {
  conversationState.phase = 'generating';
  try {
    const matchRes = await fetch(PROXY + '/gov/task/registry/match', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ case_summary: _caseSummaryText(conversationState.caseState) }),
    }).then(r => r.json()).catch(() => null);

    if (matchRes?.matched) {
      const lookupRes = await fetch(PROXY + '/gov/task/schema/lookup', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guid: _govGuid(), agency: matchRes.agency, task_key: matchRes.task_key }),
      }).then(r => r.json()).catch(() => null);

      if (lookupRes?.found) {
        conversationState.registryMatch = { agency: matchRes.agency, task_key: matchRes.task_key };
        conversationState.schema = { ...lookupRes.schema, __verified: lookupRes.verified };
        const known = conversationState.extendedFields;
        conversationState.pendingFieldIds = (lookupRes.schema.applicant_fields || [])
          .filter(f => !known[f.id]).map(f => f.id);

        if (!conversationState.pendingFieldIds.length) { await _finishFieldCollectionAndGenerateDocx(); return; }

        conversationState.phase = 'collecting_fields';
        appendBubble('ai', escHtml('신청서 작성에 필요한 정보를 몇 가지 더 확인하겠습니다.').replace(/\n/g,'<br>'));
        _askNextField();
        return;
      }
    }
  } catch (e) {
    console.warn('[K-Public] registry 매칭 시도 실패(폴백):', e.message);
  }
  // 매칭 실패/미등록 — 기존 자유 텍스트 안내로 폴백
  setTimeout(runGuidanceGen, 400);
}

function _askNextField() {
  const id = conversationState.pendingFieldIds[0];
  const field = (conversationState.schema.applicant_fields || []).find(f => f.id === id);
  appendBubble('ai', escHtml(`${field ? field.label : id}을(를) 알려주시겠어요?`));
}

async function _handleFieldCollectionTurn(text) {
  const id = conversationState.pendingFieldIds.shift();
  if (id) conversationState.extendedFields[id] = text.trim();

  if (conversationState.pendingFieldIds.length) { _askNextField(); return; }
  await _finishFieldCollectionAndGenerateDocx();
}

async function _finishFieldCollectionAndGenerateDocx() {
  conversationState.phase = 'generating';
  const typing = appendTyping();
  try {
    const blob = await window._buildApplicationDocx(
      conversationState.schema, conversationState.caseState, conversationState.extendedFields);
    typing.remove();
    const url = URL.createObjectURL(blob);
    const fileName = `${conversationState.schema.task_name}_신청서.docx`;
    const div = appendBubble('ai', `
      <div class="verdict-card">
        <div class="vc-badge">신청서 준비 완료</div>
        <div class="vc-summary" style="font-weight:400;font-size:13.5px;line-height:1.8">
          ${escHtml(conversationState.schema.agency_name)} — ${escHtml(conversationState.schema.task_name)} 신청서를 작성했습니다.
          아래에서 내려받아 확인·수정 후 정부24에서 발급받은 서류와 함께 제출하십시오.
        </div>
        <a class="kpub-docx-download" href="${url}" download="${fileName.replace(/"/g,'')}"
           style="display:inline-block;margin-top:10px;padding:8px 14px;background:var(--pri);color:#fff;border-radius:8px;text-decoration:none;font-size:13.5px;">
          ${escHtml(fileName)} 다운로드
        </a>
      </div>
    `);
    conversationState.phase = 'done';
    _reportSessionEnd(fileName, (conversationState.caseState.type || '') + ' 신청서 자동생성 완료').catch(()=>{});
  } catch (e) {
    typing.remove();
    appendBubble('ai', `⚠ 신청서 생성 중 오류: ${escHtml(e.message)} — 대신 일반 안내로 진행하겠습니다.`);
    setTimeout(runGuidanceGen, 400);
  }
}

// ══════════════════════════════════════════════════════════════
// 안내문 생성 — K-Law의 STEP 0~C처럼 무거운 다단계 생성이 필요 없어
// 단일 호출로 처리한다(gov-flash 티어, 추론 불필요).
// ══════════════════════════════════════════════════════════════
async function runGuidanceGen() {
  const cs = conversationState.caseState || {};
  const typing = appendTyping();

  const genPrompt = `아래 파악된 민원 정보를 바탕으로 안내문을 작성하세요.
민원유형: ${cs.type||''}
신청인구분: ${cs.applicant||''}
목적: ${cs.purpose||''}
관할지역: ${cs.region||''}
긴급여부: ${cs.urgency||''}
추가사실: ${cs.extra||''}

다음 형식으로 작성하세요(마크다운 헤더 없이 평문 단락으로):
1) 담당 기관(도청/시청/읍면동사무소 중 정확히 어디인지, 구체적 부서명까지 가능하면)
2) 필요 서류
3) 처리 절차(단계별로 간결하게)
4) 예상 소요 기간(확실하지 않으면 그렇게 명시)
5) 유의사항(있다면)
마지막 줄에 "정확한 접수·처리는 반드시 위 기관의 공식 채널(정부24, 해당 기관 홈페이지 또는
방문·전화)을 통해 진행하십시오."를 반드시 포함하세요. 상태 마커는 붙이지 마세요.`;

  try {
    const result = await _govCall([...conversationState.messages, { role:'user', content: genPrompt }], { maxTokens: 1800 });
    typing.remove();
    appendBubble('ai', `
      <div class="verdict-card">
        <div class="vc-badge">민원 안내</div>
        <div class="vc-summary" style="font-weight:400;font-size:13.5px;line-height:1.8">${escHtml(result).replace(/\n/g,'<br>')}</div>
      </div>
    `);
    conversationState.phase = 'done';
    conversationState.messages.push({ role:'assistant', content: result });
    _reportSessionEnd(result, (cs.type || cs.purpose || '') + ' 관련 상담 완료').catch(()=>{});
  } catch(e) {
    typing.remove();
    appendBubble('ai', `⚠ 안내문 생성 중 오류: ${escHtml(e.message)}`);
    conversationState.phase = 'interviewing';
  }
}

async function _handleFreeQuestion(text) {
  conversationState.messages.push({ role:'user', content: text });
  const typing = appendTyping();
  try {
    const resp = await _govCall(conversationState.messages, { maxTokens: 1500 });
    typing.remove();
    appendBubble('ai', escHtml(resp).replace(/\n/g,'<br>'));
    conversationState.messages.push({ role:'assistant', content: resp });
  } catch(e) {
    typing.remove();
    appendBubble('ai', `⚠ 오류: ${escHtml(e.message)}`);
  }
}

  const section = document.getElementById('byok-key-section');
  const label   = document.getElementById('byok-key-label');
  const input   = document.getElementById('byok-key-input');
  if (!section) return;
  if (modelMode !== 'single' || selectedModels.length !== 1) { section.style.display = 'none'; return; }

  const [vendor, name] = key.split(':');
  if (!_isModelRelaySupported(vendor, name)) { section.style.display = 'none'; return; }
  section.style.display = '';
  label.textContent = `${name} (${vendor}) API Key`;
  input.value = loadByokKey(key);
}

// Anthropic은 스키마가 달라 의도적으로 제외돼 있다(worker.js 주석 참조).
// 여기 없는 벤더는 현재 실제 호출이 불가능하므로 UI에서 선택을 막는다 —
// "선택은 되는데 실제로는 공유 계정이 대신 처리되는" 조용한 오작동을 방지.
// ══════════════════════════════════════════════════════════════
const LLM_RELAY_PROVIDERS = {
  'OpenAI':    { baseUrl: 'https://api.openai.com/v1', provider: 'openai' },
  'Google':    { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai', provider: 'google' },
  'xAI':       { baseUrl: 'https://api.x.ai/v1', provider: 'xai' },
  'DeepSeek':  { baseUrl: 'https://api.deepseek.com', provider: 'deepseek' },
};
// 카탈로그 표시명 → 벤더 API가 실제로 받는 model id. worker.js가 이미
// 검증해 쓰고 있는 값(예: deepseek-chat/deepseek-reasoner)은 그대로 가져왔고,
// 나머지는 각 벤더의 공개 문서 기준 통상적인 id 표기다 — 벤더가 모델명을
// 개정하면 이 표도 함께 갱신해야 한다.
const MODEL_API_ID = {
  'OpenAI:GPT-4.1':                'gpt-4.1',
  'OpenAI:GPT-4o':                 'gpt-4o',
  'OpenAI:o3':                     'o3',
  'OpenAI:o3-mini':                'o3-mini',
  'Google:Gemini 2.5 Pro':         'gemini-2.5-pro',
  'Google:Gemini 2.5 Flash':       'gemini-2.5-flash',
  'Google:Gemini 2.0 Flash':       'gemini-2.0-flash',
  'xAI:Grok 4':                    'grok-4',
  'xAI:Grok 3':                    'grok-3',
  'xAI:Grok 3 mini':               'grok-3-mini',
  'DeepSeek:DeepSeek V4':          'deepseek-chat',
  'DeepSeek:DeepSeek R2':          'deepseek-reasoner',
};
function _isModelRelaySupported(vendor, name) {
  return !!(LLM_RELAY_PROVIDERS[vendor] && MODEL_API_ID[vendor + ':' + name]);
}
const BYOK_KEY_STORAGE_PREFIX = 'gov_byok_key_';
function saveByokKey(modelKey, key) {
  try { if (key) localStorage.setItem(BYOK_KEY_STORAGE_PREFIX + modelKey, key); else localStorage.removeItem(BYOK_KEY_STORAGE_PREFIX + modelKey); } catch(e) {}
}
function loadByokKey(modelKey) {
  try { return localStorage.getItem(BYOK_KEY_STORAGE_PREFIX + modelKey) || ''; } catch(e) { return ''; }
}
// 지금 유효한 BYOK 설정을 돌려준다 — 단일 모드 + 지원 벤더 + 키 등록까지
// 전부 갖춰졌을 때만 값을 반환한다. 하나라도 빠지면 null(=공유 계정 사용).
function _activeByok() {
  if (modelMode !== 'single' || selectedModels.length !== 1) return null;
  const key = selectedModels[0];
  const [vendor, name] = key.split(':');
  if (!_isModelRelaySupported(vendor, name)) return null;
  const apiKey = loadByokKey(key);
  if (!apiKey) return null;
  return { vendor, name, apiKey, ...LLM_RELAY_PROVIDERS[vendor], model: MODEL_API_ID[key] };
}
async function _llmRelayCall(byok, messages, opts = {}) {
  const { maxTokens = 1200, stream = false, onChunk = null } = opts;
  const resp = await fetch(PROXY + '/llm/relay', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      provider: byok.provider, baseUrl: byok.baseUrl, apiKey: byok.apiKey, model: byok.model,
      messages, max_tokens: maxTokens, stream,
    })
  });
  if (stream) {
    let fullText = '';
    await _pumpSSE(resp, (json) => {
      const delta = json.choices?.[0]?.delta?.content || '';
      if (delta) { fullText += delta; onChunk && onChunk(delta, fullText); }
    });
    return fullText;
  }
  let data;
  try { data = await resp.json(); } catch(e) { throw new Error(`HTTP ${resp.status}`); }
  if (!resp.ok || data.error) throw new Error(data.error?.message || data.error || data.message || `HTTP ${resp.status}`);
  return data.choices?.[0]?.message?.content || '';
}

let modelMode = localStorage.getItem('gov_model_mode') || 'single';
let selectedModels = (() => {
  try { return JSON.parse(localStorage.getItem('gov_selected_models') || '[]'); } catch(e) { return []; }
})();

function setModelMode(mode) {
  modelMode = mode;
  localStorage.setItem('gov_model_mode', mode);
  document.getElementById('mode-single').classList.toggle('active', mode === 'single');
  document.getElementById('mode-ensemble').classList.toggle('active', mode === 'ensemble');
  // 단일 모드로 되돌아가면 선택을 1개로 축소
  if (mode === 'single' && selectedModels.length > 1) {
    selectedModels = selectedModels.slice(0, 1);
    localStorage.setItem('gov_selected_models', JSON.stringify(selectedModels));
  }
  renderModelList();
}

function toggleModel(key) {
  const [vendor, name] = key.split(':');
  if (!_isModelRelaySupported(vendor, name)) {
    _micShowMsg?.('<strong>⚙️ 아직 연동되지 않은 모델입니다.</strong> 지금은 OpenAI·Google·xAI·DeepSeek만 자기 API 키로 사용할 수 있습니다.', 'info');
    return;
  }
  if (modelMode === 'ensemble') {
    _micShowMsg?.('<strong>⚙️ 앙상블(여러 모델 토론)은 아직 준비 중입니다.</strong> 지금은 단일 모델만 선택해 주세요.', 'info');
    return;
  }
  selectedModels = [key];
  localStorage.setItem('gov_selected_models', JSON.stringify(selectedModels));
  renderModelList();
  renderByokKeyInput();
}

function renderModelList() {
  const q = (document.getElementById('model-search')?.value || '').trim().toLowerCase();
  const list = document.getElementById('model-list');
  if (!list) return;
  const filtered = MODEL_CATALOG.filter(m =>
    !q || m.name.toLowerCase().includes(q) || m.vendor.toLowerCase().includes(q)
  );
  if (filtered.length === 0) {
    list.innerHTML = '<div class="model-empty">검색 결과가 없어요.</div>';
    return;
  }
  list.innerHTML = filtered.map(m => {
    const key = m.vendor + ':' + m.name;
    const sel = selectedModels.includes(key);
    const supported = _isModelRelaySupported(m.vendor, m.name);
    const disabledCls = supported ? '' : ' model-item-disabled';
    const badge = supported ? '' : '<span class="model-flag" style="color:var(--hint)">연동 준비중</span>';
    return `<div class="model-item ${sel?'selected':''}${disabledCls}" onclick="toggleModel('${key.replace(/'/g,"\\'")}')">
      <span class="model-check">${sel ? '✓' : ''}</span>
      <span class="model-name"><b>${escHtml(m.name)}</b><span>${escHtml(m.vendor)}</span></span>
      ${badge || `<span class="model-flag">${m.country}</span>`}
    </div>`;
  }).join('');

  const cnt = document.querySelector('.ensemble-count');
  if (modelMode === 'ensemble') {
    if (!cnt) {
      const div = document.createElement('div');
      div.className = 'ensemble-count show';
      document.getElementById('model-search').insertAdjacentElement('afterend', div);
    }
    document.querySelector('.ensemble-count').textContent = `${selectedModels.length}개 모델 선택됨 — 서로 논쟁하여 결론을 도출합니다`;
    document.querySelector('.ensemble-count').classList.add('show');
  } else if (cnt) {
    cnt.classList.remove('show');
  }
}
// 저장된 모드를 시트 버튼에 즉시 반영(최초 로드 시)
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('mode-single')?.classList.toggle('active', modelMode === 'single');
  document.getElementById('mode-ensemble')?.classList.toggle('active', modelMode === 'ensemble');
});

// ══════════════════════════════════════════════════════════════
// 음성 입력 (K-Law 모바일과 동일한 v3.6 패턴)
// ══════════════════════════════════════════════════════════════
let isRecording = false;
let recognition = null;

function _detectMicEnv() {
  const inIframe   = window.self !== window.top;
  const isSecure   = window.isSecureContext;
  const isArtifact = location.hostname.includes('claude') || location.hostname.includes('artifact');
  return { inIframe, isSecure, isArtifact };
}
async function _checkMicPermission() {
  if (!navigator.permissions) return 'unknown';
  try { const r = await navigator.permissions.query({ name:'microphone' }); return r.state; } catch(e) { return 'unknown'; }
}
function _micShowMsg(html, type = 'warn') {
  document.getElementById('mic-msg')?.remove();
  const colors = { warn:{bg:'#FFF3CD',bd:'#FDE68A',tx:'#78350F'}, error:{bg:'#FEE2E2',bd:'#FCA5A5',tx:'#7F1D1D'}, info:{bg:'#EFF6FF',bd:'#BFDBFE',tx:'#1E3A5F'} }[type] || {};
  const div = document.createElement('div');
  div.id = 'mic-msg';
  div.style.cssText = `background:${colors.bg};border:1px solid ${colors.bd};color:${colors.tx};`;
  div.innerHTML = html;
  document.getElementById('input-bar').insertAdjacentElement('beforebegin', div);
  setTimeout(() => div.remove(), 12000);
}
function _micSetIdle(btn) {
  isRecording = false; btn.classList.remove('recording');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0"/><line x1="12" y1="22" x2="12" y2="18"/><line x1="8" y1="22" x2="16" y2="22"/></svg>';
  recognition = null;
}
function _micSetActive(btn) {
  isRecording = true; btn.classList.add('recording');
  btn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
}
function _micAutoResize(ta) { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; }
function _updateSendBtn() {
  const ta = document.getElementById('chat-input');
  document.getElementById('send-btn').classList.toggle('active', ta.value.trim().length > 0);
}

async function toggleMic() {
  const btn = document.getElementById('mic-btn');
  const ta  = document.getElementById('chat-input');
  if (isRecording) { recognition && recognition.stop(); return; }

  const env = _detectMicEnv();
  if (env.isArtifact || env.inIframe) { _micShowMsg('<strong>🎙️ 미리보기 환경에서는 마이크를 사용할 수 없습니다.</strong><br>실제 배포 URL에서 사용하세요.', 'info'); return; }
  if (!env.isSecure) { _micShowMsg('<strong>🎙️ HTTPS가 아닌 환경에서는 마이크를 사용할 수 없습니다.</strong>', 'error'); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { _micShowMsg('⚠️ 이 브라우저는 음성-텍스트 변환을 지원하지 않습니다.<br>Chrome 또는 Edge를 사용해 주세요.', 'warn'); return; }
  const perm = await _checkMicPermission();
  if (perm === 'denied') { _micShowMsg('<strong>🎙️ 마이크 권한이 차단되어 있습니다.</strong><br>주소창 왼쪽 🔒 → 사이트 설정 → 마이크 → 허용 후 새로고침하세요.', 'error'); return; }

  recognition = new SR();
  recognition.lang = 'ko-KR'; recognition.continuous = true; recognition.interimResults = true; recognition.maxAlternatives = 1;
  let finalText = ta.value; let interim = '';

  recognition.onstart = () => { _micSetActive(btn); document.getElementById('mic-msg')?.remove(); };
  recognition.onresult = (e) => {
    interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    ta.value = finalText + interim; _micAutoResize(ta);
  };
  recognition.onend = () => { _micSetIdle(btn); ta.value = finalText; _micAutoResize(ta); _updateSendBtn(); };
  recognition.onerror = (e) => {
    _micSetIdle(btn);
    const msgs = {
      'not-allowed': ['마이크 권한이 거부되었습니다.<br>주소창 🔒 → 사이트 설정 → 마이크 → 허용 후 새로고침하세요.', 'error'],
      'service-not-allowed': ['음성 인식 서비스가 허용되지 않았습니다.', 'error'],
      'network': ['네트워크 오류로 음성 인식에 실패했습니다.', 'warn'],
      'no-speech': ['음성이 감지되지 않았습니다. 마이크에 가까이 대고 다시 시도하세요.', 'warn'],
      'audio-capture': ['마이크를 찾을 수 없습니다.', 'error'],
    };
    if (e.error !== 'aborted' && msgs[e.error]) _micShowMsg('🎙️ ' + msgs[e.error][0], msgs[e.error][1]);
  };
  recognition.start();
}

// ══════════════════════════════════════════════════════════════
// 초기화 — 표준 chat-input.js 모듈 마운트 (2026-07-28)
// ══════════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', async () => {
  const { mountChatInput, THEME_LINE_GREEN } = await import('./src/gopang/ui/chat-input.js');
  mountChatInput(document.getElementById('chat-input-slot'), {
    theme: THEME_LINE_GREEN,
    placeholder: '메시지를 입력하세요…',
    fileAccept: '.txt,.pdf,.docx,.jpg,.jpeg,.png',
    multiple: true,
    onSend: async (text, files) => { await sendMessage(text, files); },
  });
});
</script>
